<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Calendar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Calendar - Month, week, day, and agenda views. Light/dark theme. Keyboard shortcuts. Built on the Mwandishi template.">
  <meta name="theme-color" content="#171717">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="https://calendar.dtcwonders.online">

  <!-- Open Graph. og:image must be absolute; scrapers reject relative paths. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Calendar">
  <meta property="og:url" content="https://calendar.dtcwonders.online">
  <meta property="og:title" content="Calendar">
  <meta property="og:description" content="Calendar - Month, week, day, and agenda views. Light/dark theme.">
  <meta property="og:image" content="https://calendar.dtcwonders.online/assets/images/logo-leaf.png">
  <meta property="og:image:secure_url" content="https://calendar.dtcwonders.online/assets/images/logo-leaf.png">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Calendar">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="sw_TZ">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Calendar">
  <meta name="twitter:description" content="Calendar">
  <meta name="twitter:image" content="https://calendar.dtcwonders.online/assets/images/logo-leaf.png">

  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <script>try{const t=localStorage.getItem('cal.theme')||localStorage.getItem('mrcv.theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-bs-theme','dark')}catch(e){}</script>
  <script type="module" crossorigin src="/assets/js/index.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/css/index.css">
</head>

<body>
  <div id="root"></div>
</body>
</html>
